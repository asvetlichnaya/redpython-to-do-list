{% extends "base.html" %}
{% load bootstrap4 %}

{% block title %}Register{% endblock %}
{% block header %}
<h2>Register your account</h2>
{% endblock %}
{% block content %}
    <div class="container my-4">
        <div class="row justify-content-left">
            <div class="col-md-8 col-lg-6">
                <form method="POST" class="form">
                    {% csrf_token %}
                    {% bootstrap_form registerform %}
                    {% buttons %}
                    <button name="submit" class="btn btn-primary mb-2">Register</button>
                    {% endbuttons %}
                </form>
            </div>
        </div>
        <p>Already have an account? <a href="{% url 'log_in' %}">Login</a></p>
    </div>
{% endblock %}
